name: Validate Template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios-newapp-template/Gemfile
      FASTLANE_BIN: bundle exec fastlane
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install bundle
        run: bundle install
      - name: Validate Ruby syntax
        run: |
          ruby -c scripts/build_local.rb
          ruby -c ios-newapp-template/fastlane/Fastfile
          ruby -c ios-newapp-template/fastlane/Appfile
          ruby -c Formula/ios-fastlane-template.rb
          ruby -c templates/homebrew-tap/Formula/ios-fastlane-template.rb
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh ios-newapp-template/scripts/*.sh; do
            bash -n "$script"
          done
      - name: Regression tests with temporary projects and action doubles
        run: python3 -m unittest discover -s tests -v
      - name: List available lanes
        working-directory: ios-newapp-template
        run: bundle exec fastlane lanes
